backend:
  name: git-gateway
  branch: main 

media_folder: "assets/images/productos"
public_folder: "/assets/images/productos"

collections:
  # 1. SISTEMA DE SUBIDA DE PRODUCTOS (El que ya teníamos)
  - name: "productos"
    label: "Productos"
    folder: "content/productos"
    create: true
    format: "json"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Etiqueta (Ej. ¡NUEVO!, -15%)", name: "badge", widget: "string", required: false }
      - { label: "Título del Producto", name: "title", widget: "string" }
      - { label: "Precio Anterior", name: "old_price", widget: "number", required: false }
      - { label: "Precio Actual", name: "price", widget: "number" }
      - { label: "Imagen", name: "image", widget: "image" }
      - { label: "Enlace de Pago", name: "payment_link", widget: "string", hint: "URL de Stripe o Mercado Pago" }

  # 2. SISTEMA DE CONFIGURACIÓN DE RECIBOS (¡NUEVO!)
  # Usamos "files" en lugar de "folder" porque es un archivo único, no una lista de productos.
  - name: "configuracion"
    label: "Configuración de Tienda y Recibos"
    files:
      - file: "content/settings/factura.json"
        label: "Datos Legales para Recibos"
        name: "factura"
        fields:
          - { label: "Nombre Legal de la Tienda", name: "store_name", widget: "string" }
          - { label: "RFC / Identificación Fiscal", name: "tax_id", widget: "string" }
          - { label: "Mensaje de Agradecimiento", name: "footer_msg", widget: "string" }
